name: verify
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# One running + one pending run per ref. A newer push replaces the older
# pending run, so pushes cannot stack dozens of queued runs on the shared
# dev-home-01 org runner pool. Running jobs are never cancelled.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    env:
      COSTCAP_RUN_LABEL: ${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/security-scan.mjs
      - run: node scripts/pricing-digest.mjs --check
      - run: npm test
      - if: matrix.node == 22
        run: npm run test:coverage
      - run: npm run stress
      - run: npm run acceptance:runaway
      - run: npm pack --dry-run
      - run: node scripts/pack-check.mjs
      - name: Fail if this job leaked docker volumes (leak guard)
        if: always()
        run: |
          # Only volumes carrying THIS job's label (set by test/support/postgres.js);
          # other repos/lanes on the shared host can't trip it.
          leaked=$(docker volume ls -q --filter "label=costcap.ci-run=$COSTCAP_RUN_LABEL")
          echo "volumes left with label costcap.ci-run=$COSTCAP_RUN_LABEL: $(printf '%s' "$leaked" | grep -c . || true)"
          if [ -n "$leaked" ]; then echo "::error::this job leaked docker volumes:"; echo "$leaked" | head -20; exit 1; fi
  action-self-test:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pass
        uses: ./
        with:
          receipts: test/fixtures/cost-diff/ledger.jsonl
          cap: '100'
          baseline: test/fixtures/cost-diff/base-pass.json
          max-increase-pct: '25'
          summary-out: ${{ runner.temp }}/next-baseline.json
      - id: regress
        continue-on-error: true
        uses: ./
        with:
          receipts: test/fixtures/cost-diff/ledger.jsonl
          cap: '100'
          baseline: test/fixtures/cost-diff/base-fail.json
          max-increase-pct: '25'
      - id: next
        uses: ./
        with:
          receipts: test/fixtures/cost-diff/ledger.jsonl
          cap: '100'
          baseline: ${{ runner.temp }}/next-baseline.json
          max-increase-pct: '0'
      - name: assert outputs
        env:
          PASS_VERDICT: ${{ steps.pass.outputs.verdict }}
          PASS_DELTA: ${{ steps.pass.outputs.delta-usd }}
          REGRESS_VERDICT: ${{ steps.regress.outputs.verdict }}
          REGRESS_PCT: ${{ steps.regress.outputs.delta-pct }}
          REGRESS_OUTCOME: ${{ steps.regress.outcome }}
          REGRESS_MD: ${{ steps.regress.outputs.diff-markdown }}
          NEXT_VERDICT: ${{ steps.next.outputs.verdict }}
          NEXT_DELTA: ${{ steps.next.outputs.delta-usd }}
        run: |
          set -eu
          test "$PASS_VERDICT" = ok
          test "$PASS_DELTA" = 0.05
          test "$REGRESS_VERDICT" = cost_regression
          test "$REGRESS_PCT" = 100
          test "$REGRESS_OUTCOME" = failure
          printf '%s' "$REGRESS_MD" | grep -q 'CostCap cost diff: cost_regression'
          test "$NEXT_VERDICT" = ok
          test "$NEXT_DELTA" = 0
  e2e:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # The runner is shared: another job's apt-get can hold /var/lib/apt/lists/lock, and
      # `--with-deps` then exits 100 before any test runs (run 44470107827). Retry instead.
      - name: install chromium and its system deps (retries while apt is locked)
        run: |
          for attempt in 1 2 3 4 5; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install failed (attempt $attempt of 5)"
            [ "$attempt" = 5 ] || sleep "${PW_INSTALL_RETRY_SECONDS:-30}"
          done
          echo "::error::npx playwright install --with-deps chromium failed 5 times"
          exit 1
      - run: npx playwright test
      # persooninc/infra/actions/ci-artifacts is not resolvable from this repo
      # ("Unable to resolve action persooninc/infra, not found"), which failed the
      # job at setup. The runner IS dev-home-01, so copy the trace locally instead.
      - name: playwright-trace (failure only -> dev-home-01)
        if: failure()
        env:
          RUN_DIR: costcap/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          dest="/srv/ci-artifacts/$RUN_DIR"
          if mkdir -p "$dest" 2>/dev/null; then
            cp -r test-results playwright-report "$dest"/ 2>/dev/null || true
            echo "playwright trace saved to $dest"
          else
            echo "::warning::/srv/ci-artifacts not writable; trace left in workspace"
          fi
