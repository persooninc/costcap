name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/security-scan.mjs
      - run: node scripts/pricing-digest.mjs --check
      - run: npm test
      - if: matrix.node == 22
        run: npm run test:coverage
      - run: npm run stress
      - run: npm run acceptance:runaway
      - run: npm pack --dry-run
      - run: node scripts/pack-check.mjs
  e2e:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # persooninc/infra/actions/ci-artifacts is not resolvable from this repo
      # ("Unable to resolve action persooninc/infra, not found"), which failed the
      # job at setup. The runner IS dev-home-01, so copy the trace locally instead.
      - name: playwright-trace (failure only -> dev-home-01)
        if: failure()
        env:
          RUN_DIR: costcap/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          dest="/srv/ci-artifacts/$RUN_DIR"
          if mkdir -p "$dest" 2>/dev/null; then
            cp -r test-results playwright-report "$dest"/ 2>/dev/null || true
            echo "playwright trace saved to $dest"
          else
            echo "::warning::/srv/ci-artifacts not writable; trace left in workspace"
          fi
