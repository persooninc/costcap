name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 30
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/security-scan.mjs
      - run: node scripts/pricing-digest.mjs --check
      - run: npm test
      - if: matrix.node == 22
        run: npm run test:coverage
      - run: npm run stress
      - run: npm run acceptance:runaway
      - run: npm pack --dry-run
      - run: node scripts/pack-check.mjs
  e2e:
    runs-on: [self-hosted, dev-home-01]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # upload the Playwright trace only after a failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: playwright-trace (failure only -> dev-home-01)
        if: failure()
        uses: persooninc/infra/actions/ci-artifacts@e203328c0762512f8e80465d69b72cb88bbb708d # ci-artifacts-v1.3
        with:
          name: playwright-trace
          path: |
            test-results/
            playwright-report/
