name: deploy
# FA-CC-01: a green `verify` run on a push to main deploys that exact commit.
# Manual dispatch still works. The host preflight (scripts/deploy-remote.sh) fails
# closed before building when the host .env is incomplete, so the running image stays.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  gate:
    runs-on: [self-hosted, dev-home-01]
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: deploy only main HEAD
        id: fresh
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git fetch --quiet origin main
          if [ "$EVENT" = "workflow_run" ] && [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
            echo "deploy: $DEPLOY_SHA is no longer main HEAD; a newer verify run deploys instead"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: fail closed without production secrets
        if: steps.fresh.outputs.deploy == 'true'
        env:
          COSTCAP_ORIGIN: ${{ secrets.COSTCAP_ORIGIN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          COSTCAP_EMAIL_FROM: ${{ secrets.COSTCAP_EMAIL_FROM }}
          COSTCAP_EMAIL_PROVIDER: brevo
        run: node scripts/deploy-preflight.mjs
      - name: render one replica
        if: steps.fresh.outputs.deploy == 'true'
        env:
          COSTCAP_ORIGIN: ${{ secrets.COSTCAP_ORIGIN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          COSTCAP_EMAIL_FROM: ${{ secrets.COSTCAP_EMAIL_FROM }}
          COMPOSE_DISABLE_ENV_FILE: "1"
        run: docker compose config
      # Exit 3: the host's SSH key no longer matches infra/ssh/costcap-deploy.known_hosts (nothing was sent).
      # Exit 4: the host preflight in deploy-remote.sh refused the host .env (running image unchanged).
      # Exit 5: the host rejected COSTCAP_DEPLOY_SSH_KEY (Permission denied; nothing was sent).
      # All three need an owner. A manual dispatch fails on them; the automatic run after `verify`
      # records a warning and skips, so main stays green. prod-drift keeps reporting the lag.
      - name: apply one replica
        id: apply
        if: steps.fresh.outputs.deploy == 'true'
        env:
          COSTCAP_DEPLOY_HOST: ${{ secrets.COSTCAP_DEPLOY_HOST }}
          COSTCAP_DEPLOY_SSH_KEY: ${{ secrets.COSTCAP_DEPLOY_SSH_KEY }}
          COSTCAP_GIT_SHA: ${{ env.DEPLOY_SHA }}
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          node scripts/deploy-apply.mjs
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_run" ] && { [ "$code" = 3 ] || [ "$code" = 4 ] || [ "$code" = 5 ]; }; then
            case "$code" in
              3) reason="the deploy host's SSH key does not match the pinned known_hosts" ;;
              4) reason="the host preflight refused the host .env" ;;
              5) reason="the deploy host rejected the deploy key (Permission denied)" ;;
            esac
            echo "::warning title=auto-deploy skipped::$DEPLOY_SHA was not applied: $reason. Owner action needed; see the step log."
            echo "Auto-deploy skipped for \`$DEPLOY_SHA\`: $reason. Production is unchanged. Owner action needed before the next deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: canary the applied origin
        if: success() && steps.apply.outputs.applied == 'true'
        env:
          COSTCAP_ORIGIN: ${{ secrets.COSTCAP_ORIGIN }}
          COSTCAP_EXPECT_SHA: ${{ env.DEPLOY_SHA }}
          COSTCAP_EXPECT_PERSISTENCE: ${{ vars.COSTCAP_EXPECT_PERSISTENCE || 'single-process-file' }}
          COSTCAP_EXPECT_BILLING: ${{ vars.COSTCAP_EXPECT_BILLING || 'disabled' }}
        run: node scripts/canary.mjs "$COSTCAP_ORIGIN"
