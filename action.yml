name: CostCap receipt budget check
description: Fail a CI job when AI agent spend in a CostCap receipt ledger reaches a USD cap. Unknown spend fails closed.
author: CostCap contributors
branding:
  icon: shield
  color: green
inputs:
  receipts:
    description: Receipt JSONL file path relative to the workspace
    required: true
  cap:
    description: Maximum estimated USD across the selected receipt file
    required: true
  day-cap:
    description: Optional UTC day cap in estimated USD
    required: false
  month-cap:
    description: Optional UTC month cap in estimated USD
    required: false
  run-id:
    description: Optional run_id; the cap then counts only that run's receipts (day/month caps still cover the whole ledger). List ids with `costcap runs`
    required: false
outputs:
  verdict:
    description: ok, budget_exceeded or accounting_unavailable
    value: ${{ steps.check.outputs.verdict }}
  spent-usd:
    description: Estimated USD across the receipt file; empty when any cost is unknown
    value: ${{ steps.check.outputs.spent-usd }}
  cap-usd:
    description: The cap input in USD
    value: ${{ steps.check.outputs.cap-usd }}
  day-spent-usd:
    description: Estimated USD for the current UTC day; empty when any cost is unknown
    value: ${{ steps.check.outputs.day-spent-usd }}
  month-spent-usd:
    description: Estimated USD for the current UTC month; empty when any cost is unknown
    value: ${{ steps.check.outputs.month-spent-usd }}
  unknown-receipts:
    description: Number of receipts with unknown (null) cost
    value: ${{ steps.check.outputs.unknown-receipts }}
  receipts-count:
    description: Number of receipts read
    value: ${{ steps.check.outputs.receipts-count }}
  run-id:
    description: The run_id the cap was scoped to; empty for a whole-ledger check
    value: ${{ steps.check.outputs.run-id }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - id: check
      shell: bash
      env:
        COSTCAP_RECEIPTS: ${{ inputs.receipts }}
        COSTCAP_CAP: ${{ inputs.cap }}
        COSTCAP_DAY_CAP: ${{ inputs.day-cap }}
        COSTCAP_MONTH_CAP: ${{ inputs.month-cap }}
        COSTCAP_RUN_ID: ${{ inputs.run-id }}
        COSTCAP_ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(check --receipts "$COSTCAP_RECEIPTS" --cap "$COSTCAP_CAP" --github-output)
        if [ -n "$COSTCAP_DAY_CAP" ]; then args+=(--day-cap "$COSTCAP_DAY_CAP"); fi
        if [ -n "$COSTCAP_MONTH_CAP" ]; then args+=(--month-cap "$COSTCAP_MONTH_CAP"); fi
        if [ -n "$COSTCAP_RUN_ID" ]; then args+=(--run-id "$COSTCAP_RUN_ID"); fi
        node "$COSTCAP_ACTION_PATH/src/cli.js" "${args[@]}"
